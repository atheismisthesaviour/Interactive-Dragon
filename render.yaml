services:
  - type: web
    name: brandguard-ai-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: brandguard-ai-db
          property: connectionString
      - key: REVIEWER_API_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: CORS_ORIGINS
        value: "*"
      - key: UPLOAD_DIR
        value: ./uploads

databases:
  - name: brandguard-ai-db
    plan: free
    region: singapore
    postgresMajorVersion: "18"
